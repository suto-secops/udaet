name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: kdeneon/plasma:unstable
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt and KDE dependencies
        run: |
          apt-get update
          apt-get install -y \
            cmake g++ extra-cmake-modules \
            qt6-base-dev qt6-declarative-dev \
            kf6-kirigami2-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
