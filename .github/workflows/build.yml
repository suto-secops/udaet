name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build in Arch Linux
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src" \
            --workdir /src \
            archlinux:latest \
            bash -euxo pipefail -c '
              pacman -Sy --noconfirm \
                base-devel cmake extra-cmake-modules \
                qt6-base qt6-declarative kirigami sqlite
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
              cmake --build build --parallel
            '
